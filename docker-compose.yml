version: '3.8'

services:
  seranex-lanka-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seranex-lanka-engine
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_HOT_LEADS_WEBHOOK=${DISCORD_HOT_LEADS_WEBHOOK}
      - ADMIN_WHATSAPP_NUMBER=${ADMIN_WHATSAPP_NUMBER:-947228382638}
      - BOT_WHATSAPP_NUMBER=${BOT_WHATSAPP_NUMBER:-94760602638}
      - WHATSAPP_AUTO_SEND=${WHATSAPP_AUTO_SEND:-true}
      - AGENCY_NAME=Seranex Lanka Solutions
      - AGENCY_PHONE=07228382638
      - AGENCY_WEBSITE=https://seranex.lk
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-info@seranex.lk}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    volumes:
      # Persistent storage for WhatsApp Web authentication session
      - seranex_wwebjs_auth:/app/.wwebjs_auth
      # Persistent JSON databases for leads and conversations
      - ./leads_db.json:/app/leads_db.json
      - ./seen_leads.json:/app/seen_leads.json
      - ./wa_conversations.json:/app/wa_conversations.json
      - ./wa_sent.json:/app/wa_sent.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  seranex_wwebjs_auth:
    name: seranex_wwebjs_auth
